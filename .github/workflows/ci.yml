name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@356a5b38a8fe5b4ac9d11266e42e6196dc6bde49 # v0.6.68
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      recipe: verify
      prepare: setup-checks
      python-version: 3.13.18
      uv-version: 0.13.8
      node-version: 26.13.1
      fetch-depth: 0
      tool-assets: .github/ci-tools.json
      timeout-minutes: 20

  workflows:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@356a5b38a8fe5b4ac9d11266e42e6196dc6bde49 # v0.6.68
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      recipe: audit-workflows
      arguments: ${{ format('["{0}"]', github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all') }}
      fetch-depth: 0
      tool-assets: .github/ci-tools.json
      timeout-minutes: 10

  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@356a5b38a8fe5b4ac9d11266e42e6196dc6bde49 # v0.6.68
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
